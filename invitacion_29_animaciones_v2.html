  <style>
:root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html { background: #071025; }
body { margin: 0; min-height: 100svh; background: #071025; }
/* El único contenido visual es la invitación, centrada y sin encabezados ni pies */
.stage { min-height:100svh; display:grid; place-items:center; width:100%; }
.poster { position:relative; isolation:isolate; overflow:hidden; display:block; width:min(100vw,680px); aspect-ratio:1199/1312; background:#e50914; }
.poster-base { width:100%; height:100%; display:block; object-fit:fill; -webkit-user-drag:none; user-select:none; }
.poster { animation:poster-arrive 1s cubic-bezier(.2,.8,.15,1) both; }
@keyframes poster-arrive { 0%{opacity:.5;transform:translateY(12px) scale(.975)} 55%{opacity:1;transform:translateY(0) scale(1.008)} 100%{opacity:1;transform:none} }
.fx { position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden; }
/* LOOP DE TELARAÑAS (10 s): se dibujan, brillan suavemente, desaparecen y descansan.
   Las esquinas están desfasadas para evitar demasiado movimiento simultáneo. */
.web-corner { position:absolute;width:23%;height:auto;fill:none;stroke:#fff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #e8fcff9a); opacity:0;animation:web-opacity-loop 10s ease-in-out .25s infinite; }
.web-corner.top { top:0;left:0; }
.web-corner.bottom { bottom:0;right:0;transform:rotate(180deg);animation-delay:1.65s; }
.web-corner path { stroke-dasharray:100;stroke-dashoffset:100;animation:web-draw-loop 10s ease-in-out .25s infinite; }
.web-corner.bottom path { animation-delay:1.65s; }
@keyframes web-opacity-loop {
  0%,4%,44%,100% {opacity:0}
  11%,30% {opacity:.58}
  38% {opacity:.32}
}
@keyframes web-draw-loop {
  0%,4% {stroke-dashoffset:100}
  30%,43% {stroke-dashoffset:0}
  44%,100% {stroke-dashoffset:100}
}
.spider { position:absolute;width:3.3%;min-width:12px;max-width:24px;opacity:0;filter:drop-shadow(0 1px 2px #0009);animation:spider-down 2.4s cubic-bezier(.22,.75,.28,1) .9s both,spider-sway 4s ease-in-out 3.4s infinite alternate; }
.spider.one {top:7%;right:11%;}
.spider.two {top:40%;left:15%;width:2.7%;animation-delay:1.45s,3.9s;}
.spider::before {content:"";display:block;position:absolute;width:1px;height:70px;left:50%;bottom:92%;background:#fff;opacity:.84;}
.spider svg {display:block;width:100%;height:auto;}
@keyframes spider-down {0%{opacity:0;transform:translateY(-25px)}20%{opacity:.86}100%{opacity:.86;transform:translateY(25px)}}
@keyframes spider-sway {from{transform:translate(0,25px) rotate(-4deg)}to{transform:translate(3px,32px) rotate(5deg)}}
.twinkle {position:absolute;width:1.6%;aspect-ratio:1;opacity:0;transform:scale(.45);animation:twinkle 4.8s ease-in-out infinite;}
.twinkle::before,.twinkle::after{content:"";position:absolute;background:#fffde9;box-shadow:0 0 9px #ffefbd;border-radius:99px;}
.twinkle::before{width:20%;height:100%;top:0;left:40%}.twinkle::after{width:100%;height:20%;top:40%;left:0}
.twinkle.a{top:32%;left:9%}.twinkle.b{top:54%;right:6%;animation-delay:1.4s}.twinkle.c{bottom:14%;left:35%;animation-delay:2.7s}.twinkle.d{top:11%;right:15%;animation-delay:3.7s}
@keyframes twinkle{0%,30%,100%{opacity:0;transform:scale(.45)}37%{opacity:.65;transform:scale(.85)}50%{opacity:.18;transform:scale(.65)}}
/* LOOP DE ONOMATOPEYA/IMPACTO CÓMIC (8 s): un pulso breve sobre la explosión
   blanca del título, seguido por varios segundos de reposo. No modifica el PNG. */
.comic-echo{position:absolute;left:14%;top:6%;width:70%;height:31%;border:2px solid #ffffffd4;border-radius:44% 55% 52% 48%;opacity:0;transform:scale(.9);mix-blend-mode:screen;box-shadow:0 0 16px #ffffff5c;animation:comic-hit-loop 8s cubic-bezier(.2,.65,.1,1) .65s infinite;}
@keyframes comic-hit-loop {
  0%,6% {opacity:0;transform:scale(.90)}
  13% {opacity:.52;transform:scale(1)}
  22% {opacity:.18;transform:scale(1.07)}
  31% {opacity:0;transform:scale(1.14)}
  32%,100% {opacity:0;transform:scale(.90)}
}
/* Zonas invisibles en porcentajes exactos sobre el PNG 1199 x 1312 */
.hotspot{position:absolute;z-index:4;display:block;border-radius:12px;cursor:pointer;background:transparent;-webkit-tap-highlight-color:rgba(255,240,120,.3);touch-action:manipulation;transition:background .2s,box-shadow .2s,transform .16s;}
.hotspot:hover,.hotspot:focus-visible{background:rgba(255,255,100,.07);box-shadow:inset 0 0 0 2px #fffbdaae,0 0 18px #ffd83d88;outline:none;}
.hotspot:active{transform:scale(.985);background:rgba(255,212,67,.16);}
.hotspot.date{left:25.94%;top:51.14%;width:49.04%;height:9.22%;}
.hotspot.time{left:25.94%;top:60.75%;width:41.70%;height:8.31%;}
.hotspot.address{left:25.85%;top:79.95%;width:46.87%;height:9.22%;}
/* Solo si existe un archivo MP3 con los permisos de publicación correspondientes */
.audio-toggle{position:absolute;z-index:5;top:49%;right:2.6%;width:44px;height:44px;display:grid;place-items:center;border:1px solid #e5ebffb8;border-radius:50%;background:#081932c4;color:#fff;font-size:20px;box-shadow:0 3px 12px #0007;cursor:pointer;touch-action:manipulation;}
.audio-toggle[hidden]{display:none;}
.audio-toggle:hover,.audio-toggle:focus-visible{background:#204b88;outline:2px solid #ffdc52;outline-offset:2px;}

/* PISTAS INTERACTIVAS: secuencia cíclica de 12s sobre los iconos impresos en el PNG.
   Solo se animan elementos superpuestos. La imagen original no se modifica. */
.map-radar,.calendar-bounce,.label-sweep {position:absolute;pointer-events:none;}
.map-radar {left:26.0%;top:80.02%;width:10.6%;aspect-ratio:1;}
.map-radar::before,.map-radar::after {
  content:"";position:absolute;inset:1%;border:2px solid #ffe65d;
  border-radius:50%;opacity:0;transform:scale(.92);
  box-shadow:0 0 8px #ffeb7b8c,inset 0 0 5px #fff3ba50;
  animation:map-radar-first 12s ease-out infinite;
}
.map-radar::after {border-color:#fff5b5;animation-name:map-radar-second;}
@keyframes map-radar-first {
  0%,23%,42%,100%{opacity:0;transform:scale(.92)}
  27%{opacity:.88;transform:scale(1)}
  37%{opacity:0;transform:scale(1.33)}
}
@keyframes map-radar-second {
  0%,29%,48%,100%{opacity:0;transform:scale(.92)}
  33%{opacity:.7;transform:scale(1)}
  43%{opacity:0;transform:scale(1.31)}
}
/* En vez de desplazar el arte ya impreso (y duplicar el icono), rebota
   un halo alrededor del calendario sin tocar ni tapar el diseño. */
.calendar-bounce {left:26.2%;top:50.84%;width:10.45%;aspect-ratio:1;}
.calendar-bounce::before {
  content:"";position:absolute;inset:2%;border:2px solid #fff5ac;
  border-radius:50%;box-shadow:0 0 8px #fff6bd,0 0 17px #f4d95996;
  opacity:0;transform:translateY(0) scale(1);
  animation:calendar-nudge-loop 12s ease-in-out infinite;
}
@keyframes calendar-nudge-loop {
  0%,48%,68%,100%{opacity:0;transform:translateY(0) scale(.97)}
  51%{opacity:.9;transform:translateY(-3px) scale(1.035)}
  54%{opacity:.72;transform:translateY(1px) scale(.99)}
  57%{opacity:.88;transform:translateY(-2px) scale(1.03)}
  61%{opacity:.5;transform:translateY(0) scale(1)}
  67%{opacity:0;transform:translateY(0) scale(1)}
}
/* Destellos breves y no intrusivos SOBRE las franjas ya existentes.
   No añaden texto ni botones y evitan cubrir la mayor parte de las letras. */
.label-sweep {overflow:hidden;border-radius:14px;clip-path:polygon(0 0,97% 0,100% 88%,2% 100%);}
.label-sweep.date {left:36.7%;top:51.75%;width:36%;height:7.45%;}
.label-sweep.address {left:36.7%;top:80.58%;width:35%;height:7.2%;}
.label-sweep::before {
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 31%,#ffeb8900 39%,#ffe45f45 48%,#fff4a782 51%,#ffe45f26 54%,transparent 63%);
  opacity:0;transform:translateX(-155%);
  animation:label-glimmer-loop 12s ease-in-out infinite;
}
.label-sweep.address::before {animation-delay:1.05s;}
@keyframes label-glimmer-loop {
  0%,70%,100%{opacity:0;transform:translateX(-155%)}
  73%{opacity:.7;transform:translateX(-138%)}
  83%{opacity:.7;transform:translateX(145%)}
  86%{opacity:0;transform:translateX(160%)}
}
/* Pista adicional al acercar el cursor o al enfocar con teclado. */
@media(hover:hover){
  .hotspot:hover{background:rgba(255,245,152,.10);box-shadow:inset 0 0 0 2px #fff9b9,0 0 17px #ffe365b5;}
}
.hotspot:focus-visible{outline:3px solid #ffe96d;outline-offset:2px;}
/* El usuario puede desactivar todo el movimiento en sus preferencias. */
@media(prefers-reduced-motion:reduce){
  .map-radar,.calendar-bounce,.label-sweep{display:none!important;}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.web-corner,.spider,.twinkle,.comic-echo{display:none!important}}
  </style>
</head>

  <audio id="birthdayMusic" src="./musica.mp3" loop preload="none"></audio>
  <script>
  (() => {
    const audio = document.getElementById('birthdayMusic');
    const button = document.getElementById('audioToggle');
    const setState = () => {
      const active = !audio.paused && !audio.muted;
      button.textContent = active ? '🔊' : '🔇';
      button.setAttribute('aria-label', active ? 'Silenciar música' : 'Activar música');
      button.setAttribute('aria-pressed', String(active));
    };
    // La música es opcional. Si no hay musica.mp3, el botón nunca aparece.
    // Conservar el archivo fuera del despliegue hasta tener permisos de distribución.
    fetch('./musica.mp3', {method:'HEAD'}).then(r => {
      if (!r.ok || !r.headers.get('content-type')?.includes('audio')) return;
      button.hidden = false;
      audio.preload = 'metadata';
    }).catch(() => {});
    button.addEventListener('click', async () => {
      if (!audio.paused && !audio.muted) { audio.muted = true; setState(); return; }
      audio.muted = false;
      try { await audio.play(); } catch { audio.muted = true; }
      setState();
    });
    audio.addEventListener('pause',setState);
    audio.addEventListener('play',setState);
    audio.addEventListener('volumechange',setState);
  })();
  </script>
