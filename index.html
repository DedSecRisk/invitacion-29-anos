@keyframes poster-arrive { 0%{opacity:.5;transform:translateY(12px) scale(.975)} 55%{opacity:1;transform:translateY(0) scale(1.008)} 100%{opacity:1;transform:none} }
.fx { position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden; }
.web-corner { position:absolute;width:23%;height:auto;fill:none;stroke:#fff;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #e8fcff9a); opacity:0; animation:web-reveal .9s ease .2s both; }
.web-corner.top { top:0;left:0; }
.web-corner.bottom { bottom:0;right:0;transform:rotate(180deg); animation-delay:.45s; }
.web-corner path { stroke-dasharray:680;stroke-dashoffset:680;animation:web-draw 2.8s ease-out .33s both; }
@keyframes web-draw { to{stroke-dashoffset:0} }
@keyframes web-reveal { from{opacity:0}to{opacity:.64} }
.spider { position:absolute;width:3.3%;min-width:12px;max-width:24px;opacity:0;filter:drop-shadow(0 1px 2px #0009);animation:spider-down 2.4s cubic-bezier(.22,.75,.28,1) .9s both,spider-sway 4s ease-in-out 3.4s infinite alternate; }
.spider.one {top:7%;right:11%;}
.spider.two {top:40%;left:15%;width:2.7%;animation-delay:1.45s,3.9s;}
.spider::before {content:"";display:block;position:absolute;width:1px;height:70px;left:50%;bottom:92%;background:#fff;opacity:.84;}
.spider svg {display:block;width:100%;height:auto;}
@keyframes spider-down {0%{opacity:0;transform:translateY(-25px)}20%{opacity:.86}100%{opacity:.86;transform:translateY(25px)}}
@keyframes spider-sway {from{transform:translate(0,25px) rotate(-4deg)}to{transform:translate(3px,32px) rotate(5deg)}}
.twinkle {position:absolute;width:1.6%;aspect-ratio:1;opacity:0;transform:scale(.45);animation:twinkle 4.8s ease-in-out infinite;}
.twinkle::before,.twinkle::after{content:"";position:absolute;background:#fffde9;box-shadow:0 0 9px #ffefbd;border-radius:99px;}
.twinkle::before{width:20%;height:100%;top:0;left:40%}.twinkle::after{width:100%;height:20%;top:40%;left:0}
.twinkle.a{top:32%;left:9%}.twinkle.b{top:54%;right:6%;animation-delay:1.4s}.twinkle.c{bottom:14%;left:35%;animation-delay:2.7s}.twinkle.d{top:11%;right:15%;animation-delay:3.7s}
@keyframes twinkle{0%,30%,100%{opacity:0;transform:scale(.45)}37%{opacity:.65;transform:scale(.85)}50%{opacity:.18;transform:scale(.65)}}
.comic-echo{position:absolute;left:14%;top:6%;width:70%;height:31%;border:2px solid #ffffffd4;border-radius:44% 55% 52% 48%;opacity:0;transform:scale(.88);mix-blend-mode:screen;box-shadow:0 0 16px #ffffff5c;animation:comic-hit 950ms cubic-bezier(.2,.65,.1,1) .58s both;}
@keyframes comic-hit{0%{opacity:0;transform:scale(.88)}25%{opacity:.55}70%{opacity:.18}100%{opacity:0;transform:scale(1.15)}}
/* Zonas invisibles en porcentajes exactos sobre el PNG 1199 x 1312 */
.hotspot{position:absolute;z-index:4;display:block;border-radius:12px;cursor:pointer;background:transparent;-webkit-tap-highlight-color:rgba(255,240,120,.3);touch-action:manipulation;transition:background .2s,box-shadow .2s,transform .16s;}
.hotspot:hover,.hotspot:focus-visible{background:rgba(255,255,100,.07);box-shadow:inset 0 0 0 2px #fffbdaae,0 0 18px #ffd83d88;outline:none;}
.hotspot:active{transform:scale(.985);background:rgba(255,212,67,.16);}
.hotspot.date{left:25.94%;top:51.14%;width:49.04%;height:9.22%;}
.hotspot.time{left:25.94%;top:60.75%;width:41.70%;height:8.31%;}
.hotspot.address{left:25.85%;top:79.95%;width:46.87%;height:9.22%;}
/* Solo si existe un archivo MP3 con los permisos de publicación correspondientes */
.audio-toggle{position:absolute;z-index:5;top:49%;right:2.6%;width:44px;height:44px;display:grid;place-items:center;border:1px solid #e5ebffb8;border-radius:50%;background:#081932c4;color:#fff;font-size:20px;box-shadow:0 3px 12px #0007;cursor:pointer;touch-action:manipulation;}
.audio-toggle[hidden]{display:none;}
.audio-toggle:hover,.audio-toggle:focus-visible{background:#204b88;outline:2px solid #ffdc52;outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.web-corner,.spider,.twinkle,.comic-echo{display:none!important}}

  <audio id="birthdayMusic" src="./musica.mp3" loop preload="none"></audio>
  <script>
  (() => {
    const audio = document.getElementById('birthdayMusic');
    const button = document.getElementById('audioToggle');
    const setState = () => {
      const active = !audio.paused && !audio.muted;
      button.textContent = active ? '🔊' : '🔇';
      button.setAttribute('aria-label', active ? 'Silenciar música' : 'Activar música');
      button.setAttribute('aria-pressed', String(active));
    };
    // La música es opcional. Si no hay musica.mp3, el botón nunca aparece.
    // Conservar el archivo fuera del despliegue hasta tener permisos de distribución.
    fetch('./musica.mp3', {method:'HEAD'}).then(r => {
      if (!r.ok || !r.headers.get('content-type')?.includes('audio')) return;
      button.hidden = false;
      audio.preload = 'metadata';
    }).catch(() => {});
    button.addEventListener('click', async () => {
      if (!audio.paused && !audio.muted) { audio.muted = true; setState(); return; }
      audio.muted = false;
      try { await audio.play(); } catch { audio.muted = true; }
      setState();
    });
    audio.addEventListener('pause',setState);
    audio.addEventListener('play',setState);
    audio.addEventListener('volumechange',setState);
  })();
  </script>
